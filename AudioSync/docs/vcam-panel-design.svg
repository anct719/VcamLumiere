<svg width="460" height="520" xmlns="http://www.w3.org/2000/svg">
  <rect width="460" height="520" fill="#14141f"/>
  <text x="18" y="26" fill="#888" font-size="12" font-family="monospace">VCamPlus 悬浮面板设计 v4.0 (左功能菜单 + 右声音设置 · 纯 UI 重排, 功能零改动)</text>

  <!-- 悬浮面板 -->
  <rect x="20" y="40" width="420" height="440" rx="14" fill="#16213e" stroke="#3a5a8c" stroke-width="1.5"/>
  <text x="40" y="68" fill="#fff" font-size="15" font-family="monospace" font-weight="bold">vcam-iOS-V2 控制面板</text>
  <text x="378" y="68" fill="#ff6b6b" font-size="15" font-family="monospace">[✕]</text>

  <!-- ============ 左: 功能菜单 ============ -->
  <rect x="36" y="84" width="196" height="380" rx="10" fill="#101a2e" stroke="#2c4a7a"/>
  <text x="48" y="104" fill="#9fb3c8" font-size="11" font-family="monospace">功能菜单</text>

  <!-- 视频切换 1-6 -->
  <text x="48" y="126" fill="#7d8ba1" font-size="10" font-family="monospace">视频切换 (tag 1-6)</text>
  <rect x="48" y="132" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#2c4a7a"/><text x="62" y="152" fill="#cfd8e3" font-size="12" font-family="monospace">1</text>
  <rect x="94" y="132" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#2c4a7a"/><text x="108" y="152" fill="#cfd8e3" font-size="12" font-family="monospace">2</text>
  <rect x="140" y="132" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#2c4a7a"/><text x="154" y="152" fill="#cfd8e3" font-size="12" font-family="monospace">3</text>
  <rect x="48" y="166" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#2c4a7a"/><text x="62" y="186" fill="#cfd8e3" font-size="12" font-family="monospace">4</text>
  <rect x="94" y="166" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#2c4a7a"/><text x="108" y="186" fill="#cfd8e3" font-size="12" font-family="monospace">5</text>
  <rect x="140" y="166" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#2c4a7a"/><text x="154" y="186" fill="#cfd8e3" font-size="12" font-family="monospace">6</text>

  <!-- 画面控制 -->
  <text x="48" y="214" fill="#7d8ba1" font-size="10" font-family="monospace">画面控制</text>
  <rect x="48" y="220" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="62" y="240" fill="#cfd8e3" font-size="12" font-family="monospace">↑100</text>
  <rect x="94" y="220" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#22c55e"/><text x="108" y="240" fill="#4ade80" font-size="12" font-family="monospace">转</text>
  <rect x="140" y="220" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="154" y="240" fill="#cfd8e3" font-size="12" font-family="monospace">↓105</text>
  <rect x="48" y="254" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="62" y="274" fill="#cfd8e3" font-size="12" font-family="monospace">←102</text>
  <rect x="94" y="254" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="108" y="274" fill="#cfd8e3" font-size="12" font-family="monospace">正103</text>
  <rect x="140" y="254" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="154" y="274" fill="#cfd8e3" font-size="12" font-family="monospace">→104</text>
  <rect x="48" y="288" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="62" y="308" fill="#cfd8e3" font-size="12" font-family="monospace">▶107</text>
  <rect x="94" y="288" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="108" y="308" fill="#cfd8e3" font-size="12" font-family="monospace">翻106</text>
  <rect x="140" y="288" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="154" y="308" fill="#cfd8e3" font-size="12" font-family="monospace">⏸108</text>

