  <text x="48" y="336" fill="#7d8ba1" font-size="10" font-family="monospace">快捷</text>
  <rect x="48" y="342" width="42" height="30" rx="5" fill="#14532d" stroke="#22c55e"/><text x="62" y="362" fill="#4ade80" font-size="12" font-family="monospace">直播</text>
  <rect x="94" y="342" width="42" height="30" rx="5" fill="#14532d" stroke="#22c55e"/><text x="62" y="362" fill="#4ade80" font-size="12" font-family="monospace"></text><text x="100" y="362" fill="#4ade80" font-size="11" font-family="monospace">相机</text>
  <rect x="140" y="342" width="42" height="30" rx="5" fill="#7f1d1d" stroke="#ff6b6b"/><text x="154" y="362" fill="#ff9b9b" font-size="11" font-family="monospace">关闭</text>

  <!-- 颜色注入 -->
  <text x="48" y="392" fill="#7d8ba1" font-size="10" font-family="monospace">颜色注入</text>
  <rect x="48" y="398" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="62" y="418" fill="#cfd8e3" font-size="12" font-family="monospace">彩110</text>
  <rect x="94" y="398" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="108" y="418" fill="#cfd8e3" font-size="12" font-family="monospace">+111</text>
  <rect x="140" y="398" width="42" height="30" rx="5" fill="#1d2c4d" stroke="#3a5a8c"/><text x="154" y="418" fill="#cfd8e3" font-size="12" font-family="monospace">-112</text>

