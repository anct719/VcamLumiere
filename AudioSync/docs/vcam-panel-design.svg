  <rect x="246" y="84" width="178" height="380" rx="10" fill="#0f3460" stroke="#22c55e"/>
  <text x="258" y="104" fill="#4ade80" font-size="11" font-family="monospace">声音同步设置</text>

  <text x="258" y="130" fill="#cfd8e3" font-size="11" font-family="monospace">声音开关</text>
  <rect x="330" y="118" width="72" height="22" rx="5" fill="#0a1f3a" stroke="#3a5a8c"/>
  <rect x="332" y="120" width="32" height="18" rx="4" fill="#22c55e"/><text x="339" y="133" fill="#062c14" font-size="10" font-family="monospace">开</text>

  <text x="258" y="156" fill="#cfd8e3" font-size="11" font-family="monospace">音频源类型</text>
  <rect x="258" y="162" width="154" height="22" rx="5" fill="#0a1f3a" stroke="#22c55e"/>
  <text x="268" y="177" fill="#4ade80" font-size="10" font-family="monospace">自动(同源)</text>

  <text x="258" y="198" fill="#cfd8e3" font-size="11" font-family="monospace">音频地址 (OBS)</text>
  <rect x="258" y="204" width="154" height="22" rx="5" fill="#0a1f3a" stroke="#3a5a8c"/>
  <text x="268" y="219" fill="#555a66" font-size="9" font-family="monospace">http://ip:8080/stream.m3u8</text>

  <rect x="258" y="234" width="154" height="22" rx="5" fill="#2563eb"/>
  <text x="300" y="249" fill="#fff" font-size="11" font-family="monospace">测试连接</text>

  <text x="258" y="278" fill="#cfd8e3" font-size="11" font-family="monospace">音量</text>
  <rect x="290" y="271" width="90" height="5" rx="2" fill="#0a1f3a"/>
  <rect x="290" y="271" width="68" height="5" rx="2" fill="#22c55e"/>
  <circle cx="358" cy="273.5" r="6" fill="#22c55e"/>
  <text x="378" y="278" fill="#fff" font-size="10" font-family="monospace">80%</text>

  <text x="258" y="308" fill="#cfd8e3" font-size="11" font-family="monospace">同步方式</text>
  <rect x="258" y="314" width="120" height="22" rx="5" fill="#0a1f3a" stroke="#3a5a8c"/>
  <text x="268" y="329" fill="#fff" font-size="10" font-family="monospace">实时|对齐</text>

  <rect x="258" y="346" width="154" height="34" rx="6" fill="#0a1f3a"/>
  <circle cx="270" cy="363" r="5" fill="#22c55e"/>
  <text x="284" y="367" fill="#cfd8e3" font-size="10" font-family="monospace">状态: 已连接 同步对齐</text>

  <rect x="258" y="392" width="74" height="26" rx="6" fill="#22c55e"/>
  <text x="282" y="409" fill="#062c14" font-size="11" font-family="monospace" font-weight="bold">保存</text>
  <rect x="338" y="392" width="74" height="26" rx="6" fill="#334155"/>
  <text x="362" y="409" fill="#cfd8e3" font-size="11" font-family="monospace">取消</text>

  <text x="258" y="440" fill="#7d8ba1" font-size="9" font-family="monospace">所有按钮继续调用原方法 (btnTap: tag / 开关 / 滑块)</text>

  <!-- 说明 -->
  <text x="20" y="500" fill="#e8a020" font-size="11" font-family="monospace">入口: 悬浮球(可拖动) 点击展开面板; 全部 tag/action 与原来一致, 不新增不删除任何功能</text>
</svg>
