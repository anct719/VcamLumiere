name: Build iOS .deb

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Auth server URL (e.g. https://vcam.example.com)'
        required: false
        default: 'https://your-server.com'
      certificate_sha256:
        description: 'Leaf certificate SHA-256 (64 hex characters)'
        required: false
        default: ''

env:
  PACKAGE_NAME: com.lumiere.vcamlumiere
  PACKAGE_VERSION: "2.0.1"
  MONOCYPHER_COMMIT: ab2b16dd619ad5f6979a4fbe69cfa324a6fcc35f

jobs:
  build:
    name: Build VcamLumiere
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          uname -m
          bash -n build.sh

      - name: Install ldid
        run: brew install ldid

      - name: Build CydiaSubstrate stub dylib
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDKROOT" -miphoneos-version-min=15.0 \
                -dynamiclib -o deps/substrate/libsubstrate.dylib deps/substrate/substrate_stub.c \
                -framework Foundation -install_name @rpath/libsubstrate.dylib
          echo "[OK] CydiaSubstrate stub built"

      - name: Download and compile librtmp
        run: |
          git clone --depth 1 https://github.com/mirror/rtmpdump.git deps/rtmpdump || true
          if [ -d deps/rtmpdump/librtmp ]; then
            cp -r deps/rtmpdump/librtmp ./librtmp
            echo "[OK] librtmp source copied"
          else
            echo "[ERR] librtmp not found"; exit 1
          fi
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/obj
          for f in librtmp/*.c; do
            base=$(basename "$f" .c)
            case "$base" in hashswf|sslstub) echo "  skip $base"; continue;; esac
            echo "  compile $base.c"
            clang -arch arm64 -isysroot "$SDKROOT" -miphoneos-version-min=15.0 \
                  -DNO_SSL -DNO_CRYPTO -w -O2 -c "$f" -o "build/obj/${base}.o"
          done
          echo "[OK] librtmp compiled ($(ls build/obj/*.o | wc -l) objects)"

      - name: Fetch, test and compile Monocypher
        run: |
          mkdir -p deps/monocypher
          git -C deps/monocypher init
          git -C deps/monocypher remote add origin https://github.com/LoupVaillant/Monocypher.git
          git -C deps/monocypher fetch --depth 1 origin "$MONOCYPHER_COMMIT"
          git -C deps/monocypher checkout --detach FETCH_HEAD
          test "$(git -C deps/monocypher rev-parse HEAD)" = "$MONOCYPHER_COMMIT"

          clang -std=c99 -O2 -Wall -Wextra \
                -Ideps/monocypher/src -Ideps/monocypher/src/optional \
                Tests/Ed25519VerifierTests.c \
                deps/monocypher/src/monocypher.c \
                deps/monocypher/src/optional/monocypher-ed25519.c \
                -o build/ed25519-tests
          ./build/ed25519-tests

          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -std=c99 -arch arm64 -isysroot "$SDKROOT" -miphoneos-version-min=15.0 \
                -O2 -Wall -Wextra -Ideps/monocypher/src \
                -c deps/monocypher/src/monocypher.c -o build/obj/monocypher.o
          clang -std=c99 -arch arm64 -isysroot "$SDKROOT" -miphoneos-version-min=15.0 \
                -O2 -Wall -Wextra -Ideps/monocypher/src -Ideps/monocypher/src/optional \
                -c deps/monocypher/src/optional/monocypher-ed25519.c \
                -o build/obj/monocypher-ed25519.o
          echo "[OK] Monocypher verified and compiled"

      - name: Update server URL
        if: github.event.inputs.server_url != '' && github.event.inputs.server_url != 'https://your-server.com'
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          echo "Setting server URL to: ${SERVER_URL}"
          sed -i '' "s|https://thitconmeo.bond|${SERVER_URL}|g" Shared/VcamConstants.h
          sed -i '' "s|https://your-server.com|${SERVER_URL}|g" Shared/VcamConstants.h

      - name: Update certificate pin
        if: github.event.inputs.certificate_sha256 != ''
        env:
          CERTIFICATE_SHA256: ${{ github.event.inputs.certificate_sha256 }}
        run: |
          if ! [[ "$CERTIFICATE_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "[ERR] certificate_sha256 must contain exactly 64 hex characters"
            exit 1
          fi
          sed -E -i '' \
            "s|(kVCTLSCertificateSHA256Hex @\")[0-9A-Fa-f]{64}(\")|\1${CERTIFICATE_SHA256}\2|" \
            Shared/VcamConstants.h

      - name: Build VcamLumiereDaemon.dylib
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          SUBSTRATE_DIR="$(pwd)/deps/substrate"
          mkdir -p build
          LINK_OBJS=$(find build/obj -name "*.o" 2>/dev/null | tr '\n' ' ')
          echo "Linking objects: $LINK_OBJS"
          clang -arch arm64 -isysroot "$SDKROOT" -miphoneos-version-min=15.0 \
                -fobjc-arc -fmodules -O2 -w \
                -dynamiclib \
                -install_name @rpath/VcamLumiereDaemon.dylib \
                -Wl,-rpath,/var/jb/usr/lib \
                -Wl,-rpath,/var/jb/Library/Frameworks \
                -I"$SUBSTRATE_DIR" -I"$(pwd)" \
                -Ideps/monocypher/src -Ideps/monocypher/src/optional \
                -L"$SUBSTRATE_DIR" -lsubstrate \
                Daemon/Tweak.m Daemon/VCamManager.m Daemon/RTMPClient.m Daemon/H264Decoder.m \
                Shared/VcamSharedAuth.m Shared/VcamAntiHook.m \
                $LINK_OBJS \
                -framework Foundation -framework CoreMedia -framework CoreVideo \
                -framework VideoToolbox -framework Accelerate -framework CoreImage \
                -framework Security -framework CFNetwork -framework ImageIO \
                -framework QuartzCore -framework UIKit \
                -lz \
                -o build/VcamLumiereDaemon.dylib
          echo "[OK] VcamLumiereDaemon.dylib built"
          file build/VcamLumiereDaemon.dylib
          ldid -Sentitlements.plist build/VcamLumiereDaemon.dylib
          echo "[OK] Signed"

      - name: Build VcamLumiereUI.dylib
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          SUBSTRATE_DIR="$(pwd)/deps/substrate"
          CRYPTO_OBJS="build/obj/monocypher.o build/obj/monocypher-ed25519.o"
          clang -arch arm64 -isysroot "$SDKROOT" -miphoneos-version-min=15.0 \
                -fobjc-arc -fmodules -O2 -w \
                -dynamiclib \
                -install_name @rpath/VcamLumiereUI.dylib \
                -Wl,-rpath,/var/jb/usr/lib \
                -Wl,-rpath,/var/jb/Library/Frameworks \
                -I"$SUBSTRATE_DIR" -I"$(pwd)" \
                -Ideps/monocypher/src -Ideps/monocypher/src/optional \
                -L"$SUBSTRATE_DIR" -lsubstrate \
                UI/Tweak.m UI/VcamHelper.m UI/VcamLoginHelper.m \
                UI/VcamLiveVerifier.m UI/VcamPinnedSession.m \
                UI/VcamPassthroughWindow.m UI/VcamVolumeObserver.m \
                Shared/VcamSharedAuth.m Shared/VcamAntiHook.m \
                $CRYPTO_OBJS \
                -framework Foundation -framework UIKit -framework AudioToolbox \
                -framework Security -framework AVFoundation \
                -framework CoreGraphics -framework QuartzCore \
                -o build/VcamLumiereUI.dylib
          echo "[OK] VcamLumiereUI.dylib built"
          file build/VcamLumiereUI.dylib
          ldid -Sentitlements.plist build/VcamLumiereUI.dylib
          echo "[OK] Signed"

      - name: Verify rootless linkage
        run: |
          for dylib in build/VcamLumiereDaemon.dylib build/VcamLumiereUI.dylib; do
            echo "Checking $dylib"
            otool -D "$dylib"
            otool -L "$dylib"
            otool -l "$dylib" | grep -A2 LC_RPATH
            if otool -L "$dylib" | grep -qE '/Library/MobileSubstrate|/usr/lib/libsubstrate'; then
              echo "[ERR] Rootful dependency found in $dylib"
              exit 1
            fi
          done

      - name: Package .deb
        run: |
          brew install dpkg
          STAGE="package/stage"
          mkdir -p "$STAGE/DEBIAN"
          mkdir -p "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp Layout/DEBIAN/control "$STAGE/DEBIAN/"
          cp build/VcamLumiereDaemon.dylib "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          cp build/VcamLumiereUI.dylib     "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          cp Layout/var/jb/Library/MobileSubstrate/DynamicLibraries/*.plist \
             "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          echo '#!/bin/sh' > "$STAGE/DEBIAN/postinst"
          echo 'echo "VcamLumiere installed. Please respring to activate."' >> "$STAGE/DEBIAN/postinst"
          chmod 755 "$STAGE/DEBIAN/postinst"
          echo 'SBReloadSpringBoard' > "$STAGE/DEBIAN/extrainst_"
          chmod 755 "$STAGE/DEBIAN/extrainst_"
          DEB_NAME="${PACKAGE_NAME}_${PACKAGE_VERSION}_iphoneos-arm64.deb"
          dpkg-deb -Zxz --root-owner-group --build "$STAGE" "build/$DEB_NAME"
          test "$(dpkg-deb -f "build/$DEB_NAME" Architecture)" = "iphoneos-arm64"
          if dpkg-deb -c "build/$DEB_NAME" | grep -qE '^.*\./(Library|usr)/'; then
            echo "[ERR] Rootful path found in $DEB_NAME"
            exit 1
          fi
          echo "[OK] .deb packaged"
          ls -la build/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcamlumiere-deb
          path: build/*.deb
          retention-days: 30

      - name: Upload dylibs
        uses: actions/upload-artifact@v4
        with:
          name: vcamlumiere-dylibs
          path: |
            build/VcamLumiereDaemon.dylib
            build/VcamLumiereUI.dylib
          retention-days: 30
